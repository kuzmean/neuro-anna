<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейропсихолог Ханжина Анна</title>
    
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Настройка импортов для работы React прямо в браузере -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
    
    <!-- Подключение Babel для обработки JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Brain, MapPin, Clock, Phone, CheckCircle, 
            Award, User, Activity, Menu, X, Send, Map 
        } from 'lucide-react';

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            // --- STROOP TEST STATE ---
            const [gameStatus, setGameStatus] = useState('idle'); // idle, playing, finished
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(30);
            const [currentWord, setCurrentWord] = useState(null);
            
            const colors = [
                { name: 'Красный', hex: '#EF4444', value: 'red' },
                { name: 'Синий', hex: '#3B82F6', value: 'blue' },
                { name: 'Зеленый', hex: '#22C55E', value: 'green' },
                { name: 'Желтый', hex: '#EAB308', value: 'yellow' },
                { name: 'Черный', hex: '#000000', value: 'black' },
            ];

            useEffect(() => {
                let timer;
                if (gameStatus === 'playing' && timeLeft > 0) {
                timer = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
                } else if (timeLeft === 0) {
                setGameStatus('finished');
                }
                return () => clearTimeout(timer);
            }, [gameStatus, timeLeft]);

            const startGame = () => {
                setScore(0);
                setTimeLeft(30);
                setGameStatus('playing');
                generateNewTask();
            };

            const generateNewTask = () => {
                const randomWordIndex = Math.floor(Math.random() * colors.length);
                const randomColorIndex = Math.floor(Math.random() * colors.length);
                
                setCurrentWord({
                text: colors[randomWordIndex].name,
                colorHex: colors[randomColorIndex].hex,
                correctAnswer: colors[randomColorIndex].name
                });
            };

            const handleAnswer = (selectedColorName) => {
                if (selectedColorName === currentWord.correctAnswer) {
                setScore(score + 1);
                }
                generateNewTask();
            };

            // --- FORM STATE ---
            const [formData, setFormData] = useState({ name: '', phone: '', type: 'Диагностика' });

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const text = `Здравствуйте, Анна! Меня зовут ${formData.name}. Хочу записаться на услугу: ${formData.type}. Мой номер: ${formData.phone}`;
                const url = `https://wa.me/79999999999?text=${encodeURIComponent(text)}`; 
                window.open(url, '_blank');
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800">
                
                {/* --- NAVIGATION --- */}
                <nav className="bg-white shadow-sm sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between h-16 items-center">
                        <div className="flex items-center gap-2">
                        <Brain className="h-8 w-8 text-teal-600" />
                        <span className="font-bold text-xl text-slate-800">Ханжина Анна</span>
                        </div>
                        
                        {/* Desktop Menu */}
                        <div className="hidden md:flex space-x-8">
                        <a href="#about" className="text-slate-600 hover:text-teal-600 transition">Обо мне</a>
                        <a href="#test" className="text-slate-600 hover:text-teal-600 transition">Тест Струпа</a>
                        <a href="#services" className="text-slate-600 hover:text-teal-600 transition">Услуги</a>
                        <a href="#contact" className="text-slate-600 hover:text-teal-600 transition">Контакты</a>
                        <a href="#contact" className="bg-teal-600 text-white px-4 py-2 rounded-full hover:bg-teal-700 transition">
                            Записаться
                        </a>
                        </div>

                        {/* Mobile Menu Button */}
                        <div className="md:hidden flex items-center">
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="text-slate-600">
                            {isMenuOpen ? <X /> : <Menu />}
                        </button>
                        </div>
                    </div>
                    </div>
                    
                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                    <div className="md:hidden bg-white border-t border-slate-100 p-4 space-y-4">
                        <a href="#about" className="block text-slate-600" onClick={() => setIsMenuOpen(false)}>Обо мне</a>
                        <a href="#test" className="block text-slate-600" onClick={() => setIsMenuOpen(false)}>Тест Струпа</a>
                        <a href="#services" className="block text-slate-600" onClick={() => setIsMenuOpen(false)}>Услуги</a>
                        <a href="#contact" className="block text-slate-600" onClick={() => setIsMenuOpen(false)}>Контакты</a>
                    </div>
                    )}
                </nav>

                {/* --- HERO SECTION --- */}
                <header className="relative bg-gradient-to-br from-teal-50 to-blue-50 overflow-hidden">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 md:py-28 flex flex-col md:flex-row items-center">
                    <div className="md:w-1/2 space-y-6 z-10">
                        <div className="inline-block bg-teal-100 text-teal-800 px-3 py-1 rounded-full text-sm font-semibold">
                        Нейропсихолог для детей 2-14 лет
                        </div>
                        <h1 className="text-4xl md:text-6xl font-bold leading-tight text-slate-900">
                        Помогу вашему ребенку раскрыть <span className="text-teal-600">потенциал</span>
                        </h1>
                        <p className="text-lg text-slate-600 max-w-lg">
                        Коррекция трудностей обучения и поведения. Сенсомоторная интеграция в зале «Дом Совы». Профессиональная диагностика и индивидуальный подход.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-4">
                        <a href="#contact" className="bg-teal-600 text-white px-8 py-4 rounded-xl shadow-lg hover:bg-teal-700 transition text-center font-semibold">
                            Записаться на диагностику
                        </a>
                        <a href="#test" className="bg-white text-teal-700 border border-teal-200 px-8 py-4 rounded-xl hover:bg-teal-50 transition text-center font-semibold flex items-center justify-center gap-2">
                            <Activity size={20}/> Пройти тест онлайн
                        </a>
                        </div>
                    </div>
                    
                    {/* Abstract / Image Placeholder */}
                    <div className="md:w-1/2 mt-12 md:mt-0 relative flex justify-center">
                        <div className="w-80 h-80 md:w-96 md:h-96 bg-teal-200 rounded-full absolute blur-3xl opacity-30 -top-10 -right-10"></div>
                        <div className="w-64 h-64 md:w-80 md:h-80 bg-blue-200 rounded-full absolute blur-3xl opacity-30 bottom-0 left-10"></div>
                        <img 
                        src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                        alt="Child playing with blocks" 
                        className="relative rounded-3xl shadow-2xl z-10 object-cover w-full max-w-md h-auto border-4 border-white"
                        />
                    </div>
                    </div>
                </header>

                {/* --- STROOP TEST INTERACTIVE --- */}
                <section id="test" className="py-20 bg-white">
                    <div className="max-w-4xl mx-auto px-4">
                    <div className="text-center mb-12">
                        <h2 className="text-3xl font-bold text-slate-900 mb-4">Интерактивный Тест: Эффект Струпа</h2>
                        <p className="text-slate-600 max-w-2xl mx-auto">
                        Этот классический нейропсихологический тест оценивает гибкость когнитивного мышления и скорость реакции. 
                        Задача проста: назовите <strong>ЦВЕТ шрифта</strong>, а не написанное слово.
                        </p>
                    </div>

                    <div className="bg-slate-50 rounded-3xl shadow-xl p-8 md:p-12 border border-slate-100 relative overflow-hidden">
                        {gameStatus === 'idle' && (
                        <div className="text-center space-y-6">
                            <div className="text-8xl mb-4 animate-bounce">🧠</div>
                            <h3 className="text-2xl font-bold">Готовы проверить свой мозг?</h3>
                            <p>У вас есть 30 секунд. Нажимайте на кнопки, соответствующие цвету текста.</p>
                            <button 
                            onClick={startGame}
                            className="bg-teal-600 text-white text-xl px-10 py-4 rounded-full hover:bg-teal-700 transition shadow-lg transform hover:scale-105"
                            >
                            Начать тест
                            </button>
                        </div>
                        )}

                        {gameStatus === 'playing' && currentWord && (
                        <div className="text-center">
                            <div className="flex justify-between items-center mb-8 text-lg font-semibold text-slate-500">
                            <span>Время: {timeLeft} сек</span>
                            <span>Счет: {score}</span>
                            </div>
                            
                            <div className="py-12 mb-8 bg-white rounded-2xl shadow-inner">
                            <span 
                                className="text-6xl md:text-7xl font-black transition-all duration-300"
                                style={{ color: currentWord.colorHex }}
                            >
                                {currentWord.text}
                            </span>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {colors.map((color) => (
                                <button
                                key={color.name}
                                onClick={() => handleAnswer(color.name)}
                                className="py-4 rounded-xl bg-white border-2 border-slate-200 text-slate-700 font-bold hover:border-teal-500 hover:bg-teal-50 transition"
                                >
                                {color.name}
                                </button>
                            ))}
                            </div>
                        </div>
                        )}

                        {gameStatus === 'finished' && (
                        <div className="text-center space-y-6">
                            <h3 className="text-3xl font-bold text-slate-900">Время вышло!</h3>
                            <div className="text-5xl font-bold text-teal-600">{score} баллов</div>
                            <p className="text-slate-600">
                            {score > 25 ? "Великолепный результат! Высокая скорость переключения." : 
                            score > 15 ? "Хороший результат! Но есть куда расти." : 
                            "Ваш мозг немного устал. Нейрокоррекция поможет улучшить концентрацию."}
                            </p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center mt-6">
                            <button 
                                onClick={startGame}
                                className="bg-white border-2 border-teal-600 text-teal-600 px-6 py-3 rounded-full hover:bg-teal-50 transition"
                            >
                                Попробовать еще раз
                            </button>
                            <a 
                                href="#contact"
                                className="bg-teal-600 text-white px-6 py-3 rounded-full hover:bg-teal-700 transition shadow-md"
                            >
                                Записаться на диагностику
                            </a>
                            </div>
                        </div>
                        )}
                    </div>
                    </div>
                </section>

                {/* --- ABOUT SECTION --- */}
                <section id="about" className="py-20 bg-slate-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex flex-col lg:flex-row gap-12 items-start">
                        <div className="lg:w-1/2">
                        {/* Profile Card */}
                        <div className="bg-white p-2 rounded-3xl shadow-lg transform rotate-1 hover:rotate-0 transition duration-500">
                            <img 
                            src="https://images.unsplash.com/photo-1551847677-dc82d764e1eb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                            alt="Ханжина Анна" 
                            className="rounded-2xl w-full object-cover h-96"
                            />
                            <div className="p-6">
                            <h3 className="text-2xl font-bold text-slate-800">Ханжина Анна</h3>
                            <p className="text-teal-600 font-medium">Нейропсихолог, Логопед</p>
                            <div className="flex items-center gap-2 mt-4 text-sm text-slate-500">
                                <Award size={16} /> Опыт работы: 1–3 года
                            </div>
                            </div>
                        </div>
                        </div>
                        
                        <div className="lg:w-1/2 space-y-6">
                        <h2 className="text-3xl md:text-4xl font-bold text-slate-900">
                            Комплексный подход к развитию мозга ребенка
                        </h2>
                        <div className="space-y-4 text-slate-600 leading-relaxed">
                            <p>
                            Добрый день! Я помогаю детям от 2 до 14 лет преодолеть трудности в обучении и поведении. 
                            Если ваш ребенок невнимательный, неусидчивый, испытывает трудности с письмом или чтением — я знаю, как помочь.
                            </p>
                            <p>
                            Мои занятия проходят в уникальном сенсорно-динамическом зале <strong>«Дом Совы»</strong>. 
                            Это пространство, оборудованное подвесными платформами, качелями и гамаками.
                            </p>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h4 className="font-bold text-lg mb-4 flex items-center gap-2">
                            <CheckCircle className="text-teal-500" size={20} />
                            Образование и квалификация (2025 г.)
                            </h4>
                            <ul className="space-y-3 text-sm text-slate-600">
                            <li className="flex gap-3">
                                <div className="min-w-[4px] h-4 mt-1 bg-teal-300 rounded-full"></div>
                                <span>Применение метода сенсомоторной интеграции (НМЦ «Сова-Нянька»)</span>
                            </li>
                            <li className="flex gap-3">
                                <div className="min-w-[4px] h-4 mt-1 bg-teal-300 rounded-full"></div>
                                <span>Нейропсихология (Институт практической нейропсихологии)</span>
                            </li>
                            <li className="flex gap-3">
                                <div className="min-w-[4px] h-4 mt-1 bg-teal-300 rounded-full"></div>
                                <span>Совопрактика. Особая (НМЦ «Сова-Нянька»)</span>
                            </li>
                            </ul>
                        </div>
                        </div>
                    </div>
                    </div>
                </section>

                {/* --- SERVICES & PRICING --- */}
                <section id="services" className="py-20 bg-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl font-bold text-slate-900">Услуги и стоимость</h2>
                        <p className="text-slate-500 mt-2">Индивидуальный подход к каждому ребенку</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {/* Service Card 1 */}
                        <div className="bg-slate-50 p-8 rounded-3xl hover:shadow-xl transition duration-300 flex flex-col border border-slate-100">
                        <div className="bg-teal-100 w-14 h-14 rounded-2xl flex items-center justify-center mb-6 text-teal-600">
                            <Activity size={28} />
                        </div>
                        <h3 className="text-xl font-bold mb-2">Нейропсихологическая диагностика</h3>
                        <p className="text-slate-500 text-sm mb-6 flex-grow">
                            Глубокий анализ ВПФ (внимания, памяти, мышления). 
                        </p>
                        <div className="mb-6">
                            <span className="text-2xl font-bold text-slate-900">3 000 ₽</span>
                            <span className="text-slate-400 text-sm block">1 ч 45 мин</span>
                        </div>
                        <button onClick={() => { setFormData({...formData, type: 'Диагностика'}); document.getElementById('contact').scrollIntoView(); }} className="w-full py-3 rounded-xl border border-slate-300 font-medium hover:border-teal-500 hover:text-teal-600 transition">
                            Выбрать
                        </button>
                        </div>

                        {/* Service Card 2 */}
                        <div className="bg-slate-50 p-8 rounded-3xl hover:shadow-xl transition duration-300 flex flex-col border border-slate-100 relative overflow-hidden">
                        <div className="absolute top-0 right-0 bg-teal-500 text-white text-xs px-3 py-1 rounded-bl-xl font-bold">Популярное</div>
                        <div className="bg-blue-100 w-14 h-14 rounded-2xl flex items-center justify-center mb-6 text-blue-600">
                            <Brain size={28} />
                        </div>
                        <h3 className="text-xl font-bold mb-2">Индивидуальное занятие (50 мин)</h3>
                        <p className="text-slate-500 text-sm mb-6 flex-grow">
                            Коррекция в зале «Дом Совы». Развитие моторики и когнитивных функций.
                        </p>
                        <div className="mb-6">
                            <span className="text-2xl font-bold text-slate-900">2 500 ₽</span>
                            <span className="text-slate-400 text-sm block">50 минут</span>
                        </div>
                        <button onClick={() => { setFormData({...formData, type: 'Занятие 50 мин'}); document.getElementById('contact').scrollIntoView(); }} className="w-full py-3 rounded-xl bg-teal-600 text-white font-medium hover:bg-teal-700 transition shadow-lg shadow-teal-200">
                            Выбрать
                        </button>
                        </div>

                        {/* Service Card 3 */}
                        <div className="bg-slate-50 p-8 rounded-3xl hover:shadow-xl transition duration-300 flex flex-col border border-slate-100">
                        <div className="bg-indigo-100 w-14 h-14 rounded-2xl flex items-center justify-center mb-6 text-indigo-600">
                            <Clock size={28} />
                        </div>
                        <h3 className="text-xl font-bold mb-2">Индивидуальное занятие (30 мин)</h3>
                        <p className="text-slate-500 text-sm mb-6 flex-grow">
                            Для самых маленьких или как экспресс-формат.
                        </p>
                        <div className="mb-6">
                            <span className="text-2xl font-bold text-slate-900">1 500 ₽</span>
                            <span className="text-slate-400 text-sm block">30 минут</span>
                        </div>
                        <button onClick={() => { setFormData({...formData, type: 'Занятие 30 мин'}); document.getElementById('contact').scrollIntoView(); }} className="w-full py-3 rounded-xl border border-slate-300 font-medium hover:border-teal-500 hover:text-teal-600 transition">
                            Выбрать
                        </button>
                        </div>

                        {/* Service Card 4 */}
                        <div className="bg-slate-50 p-8 rounded-3xl hover:shadow-xl transition duration-300 flex flex-col border border-slate-100">
                        <div className="bg-orange-100 w-14 h-14 rounded-2xl flex items-center justify-center mb-6 text-orange-600">
                            <User size={28} />
                        </div>
                        <h3 className="text-xl font-bold mb-2">Письменное заключение</h3>
                        <p className="text-slate-500 text-sm mb-6 flex-grow">
                            Подробный отчет по результатам диагностики с рекомендациями.
                        </p>
                        <div className="mb-6">
                            <span className="text-2xl font-bold text-slate-900">1 000 ₽</span>
                            <span className="text-slate-400 text-sm block">документ</span>
                        </div>
                        <button onClick={() => { setFormData({...formData, type: 'Заключение'}); document.getElementById('contact').scrollIntoView(); }} className="w-full py-3 rounded-xl border border-slate-300 font-medium hover:border-teal-500 hover:text-teal-600 transition">
                            Выбрать
                        </button>
                        </div>
                    </div>
                    </div>
                </section>

                {/* --- CONTACT SECTION --- */}
                <section id="contact" className="py-20 bg-slate-900 text-white relative overflow-hidden">
                    {/* Decorative bg elements */}
                    <div className="absolute top-0 right-0 w-96 h-96 bg-teal-600 rounded-full blur-3xl opacity-10 transform translate-x-1/2 -translate-y-1/2"></div>
                    
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <div className="grid lg:grid-cols-2 gap-16">
                        
                        {/* Contact Info & Map */}
                        <div className="space-y-8">
                        <div>
                            <h2 className="text-3xl font-bold mb-4">Контакты</h2>
                            <p className="text-slate-400">Запишитесь на первичную консультацию, чтобы узнать, как я могу помочь вашему ребенку!</p>
                        </div>
                        
                        <div className="space-y-6">
                            <div className="flex items-start gap-4">
                            <div className="bg-slate-800 p-3 rounded-full">
                                <MapPin className="text-teal-400" size={24} />
                            </div>
                            <div>
                                <h4 className="font-semibold text-lg">Санкт-Петербург</h4>
                                <p className="text-slate-400">ул. Одоевского, 26 лит. А</p>
                                <p className="text-xs text-slate-500 mt-1">м. Приморская (6–10 мин)</p>
                            </div>
                            </div>
                            
                            <div className="flex items-start gap-4">
                            <div className="bg-slate-800 p-3 rounded-full">
                                <Clock className="text-teal-400" size={24} />
                            </div>
                            <div>
                                <h4 className="font-semibold text-lg">График работы</h4>
                                <p className="text-slate-400">Пятница: 09:00 – 19:00</p>
                            </div>
                            </div>
                        </div>

                        {/* Yandex Map */}
                        <div className="w-full h-64 bg-slate-800 rounded-2xl relative overflow-hidden border border-slate-700 shadow-lg group">
                            <iframe 
                            src="https://yandex.ru/map-widget/v1/?text=Санкт-Петербург,+ул.+Одоевского,+26А&z=15"
                            width="100%" 
                            height="100%" 
                            frameBorder="0" 
                            allowFullScreen={true} 
                            title="Расположение офиса: Санкт-Петербург, ул. Одоевского, 26 лит А"
                            className="absolute inset-0 filter grayscale-[20%] hover:grayscale-0 transition duration-500"
                            />
                            <div className="absolute inset-0 pointer-events-none border-4 border-slate-800 rounded-2xl"></div>
                        </div>
                        </div>

                        {/* Booking Form */}
                        <div className="bg-white text-slate-900 p-8 rounded-3xl shadow-2xl">
                        <h3 className="text-2xl font-bold mb-6">Запись на прием</h3>
                        <form onSubmit={handleFormSubmit} className="space-y-4">
                            <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Ваше имя</label>
                            <input 
                                required
                                type="text" 
                                className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition"
                                placeholder="Мария Иванова"
                                value={formData.name}
                                onChange={(e) => setFormData({...formData, name: e.target.value})}
                            />
                            </div>
                            
                            <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Телефон</label>
                            <input 
                                required
                                type="tel" 
                                className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition"
                                placeholder="+7 (999) 000-00-00"
                                value={formData.phone}
                                onChange={(e) => setFormData({...formData, phone: e.target.value})}
                            />
                            </div>

                            <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Интересующая услуга</label>
                            <select 
                                className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition bg-white"
                                value={formData.type}
                                onChange={(e) => setFormData({...formData, type: e.target.value})}
                            >
                                <option>Нейропсихологическая диагностика</option>
                                <option>Индивидуальное занятие (50 мин)</option>
                                <option>Индивидуальное занятие (30 мин)</option>
                                <option>Письменное заключение</option>
                            </select>
                            </div>

                            <button type="submit" className="w-full bg-teal-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-teal-700 transition shadow-lg flex items-center justify-center gap-2">
                            <Send size={20} /> Отправить заявку
                            </button>
                            <p className="text-xs text-center text-slate-400 mt-4">
                            Нажимаю кнопку, вы перейдете в WhatsApp для отправки сообщения специалисту.
                            </p>
                        </form>
                        </div>

                    </div>
                    </div>
                </section>

                {/* --- FOOTER --- */}
                <footer className="bg-slate-950 text-slate-500 py-8 border-t border-slate-800">
                    <div className="max-w-7xl mx-auto px-4 text-center flex flex-col md:flex-row justify-between items-center">
                    <p>© 2025 Нейропсихолог Ханжина Анна</p>
                    <p className="mt-2 md:mt-0">Сделано с заботой о детях</p>
                    </div>
                </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
